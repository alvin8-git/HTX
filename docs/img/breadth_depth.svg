<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b4b8a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="560" fill="#ffffff"/>

  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#241a3d">Breadth and depth are independent axes</text>
  <text x="390" y="48" text-anchor="middle" font-size="12.5" fill="#333">
    <tspan font-weight="bold">BREADTH (%)</tspan> — how much of the reference gene has any read support
  </text>
  <text x="390" y="66" text-anchor="middle" font-size="12.5" fill="#333">
    <tspan font-weight="bold">DEPTH (×)</tspan> — how many reads stack on the bases that <tspan font-style="italic">are</tspan> covered
  </text>

  <!-- quadrants -->
  <rect x="120" y="92" width="300" height="180" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.2"/>
  <rect x="420" y="92" width="300" height="180" fill="#dff0d8" stroke="#3c763d" stroke-width="1.6"/>
  <rect x="120" y="272" width="300" height="180" fill="#eeeeee" stroke="#999999" stroke-width="1.2"/>
  <rect x="420" y="272" width="300" height="180" fill="#e8e4f3" stroke="#5b4b8a" stroke-width="1.2"/>

  <!-- top-left: fragment -->
  <text x="270" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#4d3f04">FRAGMENT, WELL SEQUENCED</text>
  <text x="270" y="176" text-anchor="middle" font-size="12" fill="#4d3f04">gene family established,</text>
  <text x="270" y="194" text-anchor="middle" font-size="12" fill="#4d3f04">allele uncertain</text>
  <text x="270" y="222" text-anchor="middle" font-size="11.5" font-style="italic" fill="#7a6410">route B of the two-route call</text>

  <!-- top-right: real gene -->
  <text x="570" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3a1f">REAL, FULL-LENGTH GENE</text>
  <text x="570" y="176" text-anchor="middle" font-size="12" fill="#1b3a1f">the confident call</text>
  <text x="570" y="222" text-anchor="middle" font-size="11.5" font-style="italic" fill="#3c763d">route A — CONFIRM</text>

  <!-- bottom-left: noise -->
  <text x="270" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">NOISE / CONSERVED DOMAIN</text>
  <text x="270" y="356" text-anchor="middle" font-size="12" fill="#333">discard</text>
  <text x="270" y="402" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666">gate 4 floor — NO_ACTION</text>

  <!-- bottom-right: thin but complete -->
  <text x="570" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#241a3d">THIN BUT COMPLETE</text>
  <text x="570" y="356" text-anchor="middle" font-size="12" fill="#241a3d">one or two molecules</text>
  <text x="570" y="402" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5b4b8a">MONITOR on short reads,</text>
  <text x="570" y="420" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5b4b8a">CONFIRM on long reads</text>

  <!-- axes -->
  <line x1="104" y1="460" x2="104" y2="86" stroke="#5b4b8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="114" y1="470" x2="726" y2="470" stroke="#5b4b8a" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="-276" y="76" transform="rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b4b8a">DEPTH  →</text>
  <text x="-186" y="94" transform="rotate(-90)" text-anchor="middle" font-size="11" fill="#666">high</text>
  <text x="-366" y="94" transform="rotate(-90)" text-anchor="middle" font-size="11" fill="#666">low</text>

  <text x="420" y="492" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b4b8a">BREADTH  →</text>
  <text x="150" y="492" text-anchor="middle" font-size="11" fill="#666">low</text>
  <text x="690" y="492" text-anchor="middle" font-size="11" fill="#666">high</text>

  <text x="390" y="530" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555">
    The two right-hand quadrants are both real genes. Only the axes tell them apart — which is why the engine gates on both.
  </text>
</svg>
